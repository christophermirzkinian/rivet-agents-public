<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100e19" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rivet Agents" />
    <meta name="application-name" content="Rivet Agents" />
    <meta name="description" content="Run your own coding agent chats from your phone: answer their cards and talk to them." />
    <title>Rivet Agents</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/boot.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="boot-g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffc23d" stop-opacity=".4" /><stop offset="1" stop-color="#100e19" stop-opacity="0" /></radialGradient>
          <linearGradient id="boot-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd25c" /><stop offset="1" stop-color="#f2a516" /></linearGradient>
        </defs>
        <rect class="glow" x="-30" y="-30" width="160" height="160" fill="url(#boot-g)" />
        <g class="bob">
          <rect x="4" y="4" width="92" height="92" rx="28" fill="url(#boot-b)" />
          <rect x="16" y="21" width="68" height="33" rx="16.5" fill="#3a2a0f" />
          <g class="eyes" fill="#ffd25c"><circle cx="37" cy="37.5" r="7.5" /><circle cx="63" cy="37.5" r="7.5" /></g>
          <path d="M37 72 46 81 64 63" fill="none" stroke="#3a2a0f" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </svg>
    </div>
  </body>
</html>
