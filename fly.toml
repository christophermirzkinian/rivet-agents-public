# Deploy the server to Fly.io: set app below to your own app name, then
#   fly apps create <your-app>
#   fly volumes create rivet_data --size 1 --region <your region>
#   fly secrets set RIVET_ORIGIN=https://<your-app>.fly.dev RIVET_BOARD_TOKEN=... RIVET_BRIDGE_TOKEN=... \
#     RIVET_ENROLL_TOKEN=... RIVET_VAPID_PUBLIC_KEY=... RIVET_VAPID_PRIVATE_KEY=... RIVET_VAPID_SUBJECT=...
#   fly deploy
# (the values are the ones `npm run setup -- --origin https://<your-app>.fly.dev` wrote to .env). Then run
# `RIVET_URL=https://<your-app>.fly.dev npm run install-bridge -- --no-server` on your Mac.
app = "rivet-agents-YOURNAME"

[build]

[env]
  NODE_ENV = "production"
  RIVET_DATA_DIR = "/data"
  RIVET_PORT = "8130"

[mounts]
  source = "rivet_data"
  destination = "/data"

[http_service]
  internal_port = 8130
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
